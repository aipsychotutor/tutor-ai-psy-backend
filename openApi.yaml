                  patient_name: "Siti Aminah"
                  background_story: "Pasien dengan riwayat depresi ringan"
      responses:
        "201":
          description: Pasien berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: "Pasien berhasil ditambahkan"
                  data:
                    type: object
                    properties:
                      patient_id:
                        type: integer
                        example: 1
                      user_id:
                        type: integer
                        example: 1
                      patient_name:
                        type: string
                        example: "Budi Santoso"
                      background_story:
                        type: string
                      personality_type:
                        type: string
                        nullable: true
                      symptom_intensity:
                        type: integer
                        nullable: true
                      age:
                        type: integer
                        nullable: true
                      gender:
                        type: string
                        nullable: true
                      occupation:
                        type: string
                        nullable: true
                      marital_status:
                        type: string
                        nullable: true
                      personality_traits:
                        type: object
                        nullable: true
                      avatar_path:
                        type: string
                        example: "/models/default.glb"
                      is_active:
                        type: boolean
                        example: true
                      is_global:
                        type: boolean
                        example: false
                      knowledge_base:
                        type: array
                        nullable: true
                        description: RAG embeddings (jika berhasil generate)
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                            vector:
                              type: array
                              items:
                                type: number
              examples:
                success:
