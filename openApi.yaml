                      occupation: "Mahasiswa"
                      marital_status: "Belum Menikah"
                      personality_traits:
                        anxiety_level: "high"
                      avatar_path: "/models/default.glb"
                      is_active: true
                      is_global: false
                      knowledge_base: [
                        {
                          text: "Mahasiswa semester 6 yang mengalami anxiety",
