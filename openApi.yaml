  /reports/{session_id}/analyze:
    post:
      tags: [Reports]
      summary: Analisis otomatis sesi (AI + prosody)
      description: >
        Melakukan analisis otomatis session menggunakan AI dan data prosody.
        Menghasilkan evaluasi otomatis beserta klasifikasi detail setiap pesan.
        Session harus sudah selesai (status: finished) dan belum pernah dievaluasi.
        Analisis menggunakan Python API eksternal untuk klasifikasi ML.
      parameters:
        - name: session_id
          in: path
          required: true
          description: ID session yang akan dianalisis
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Analisis berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Evaluasi berhasil disimpan"
                  evaluation:
                    type: object
                    description: Data evaluasi yang tersimpan
                    properties:
                      session_id:
                        type: integer
                      empathy_score:
                        type: integer
                      question_score:
                        type: integer
                      feedback_text:
                        type: string
                        nullable: true
                  classification_results:
                    type: array
                    description: Hasil klasifikasi per message
                    items:
                      type: object
                      properties:
                        transcript_id:
                          type: integer
                        message:
                          type: string
                        predicted_class:
                          type: string
                          description: Tipe pertanyaan (open/closed/reflection/etc)
                        confidence:
                          type: number
                          description: Confidence score 0-1
                  detailed_analysis:
                    type: object
                    properties:
                      model_statistics:
                        type: object
                        description: Statistik dari ML model
                        properties:
                          open_questions:
                            type: integer
                          closed_questions:
                            type: integer
                          reflections:
                            type: integer
                      total_counselor_messages:
                        type: integer
                        description: Total pesan dari konselor
                      prosody_analysis:
                        type: object
                        nullable: true
                        description: Analisis prosody user
                        properties:
                          avg_pitch:
                            type: number
                          avg_energy:
                            type: number
                          avg_tempo:
                            type: number
                      python_api_used:
                        type: string
                        description: URL Python API yang digunakan
              examples:
                success:
                  summary: Analisis berhasil
                  value:
                    success: true
                    message: "Evaluasi berhasil disimpan"
                    evaluation:
                      session_id: 1
                      empathy_score: 82
                      question_score: 75
                      feedback_text: "Analisis otomatis: Konselor menggunakan 5 pertanyaan terbuka"
                    classification_results:
                      - transcript_id: 2
                        message: "Bagaimana perasaanmu saat ini?"
                        predicted_class: "open_question"
                        confidence: 0.95
                      - transcript_id: 4
                        message: "Apakah kamu merasa cemas?"
                        predicted_class: "closed_question"
                        confidence: 0.88
                    detailed_analysis:
                      model_statistics:
                        open_questions: 5
                        closed_questions: 2
                        reflections: 3
                      total_counselor_messages: 10
                      prosody_analysis:
                        avg_pitch: 225.3
                        avg_energy: 0.68
                        avg_tempo: 1.15
                      python_api_used: "http://localhost:5000"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
              examples:
                not_finished:
                  summary: Session belum selesai
                  value:
                    success: false
                    message: "Session belum selesai"
                already_evaluated:
                  summary: Sudah dievaluasi
                  value:
                    success: false
                    message: "Session ini sudah pernah dievaluasi"
                no_transcript:
                  summary: Tidak ada transkrip
                  value:
                    success: false
                    message: "Session tidak memiliki transkrip"
        "404":
          description: Session tidak ditemukan atau tidak punya akses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
              examples:
                not_found:
                  summary: Session tidak ditemukan
                  value:
                    success: false
                    message: "Session tidak ditemukan"
                no_access:
                  summary: Tidak punya akses
                  value:
                    success: false
                    message: "User tidak punya akses ke session ini"
        "500":
          description: Error server
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
