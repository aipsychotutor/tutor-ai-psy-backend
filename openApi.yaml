                  message:
                    type: string
                    example: "Berhasil migrasi 5 dari 10 pasien."
              examples:
                success:
                  summary: Migrasi berhasil
                  value:
                    status: success
                    message: "Berhasil migrasi 5 dari 10 pasien."
                no_patients:
                  summary: Tidak ada pasien yang perlu migrasi
                  value:
                    status: success
                    message: "Berhasil migrasi 0 dari 0 pasien."
        "500":
          description: Error saat migrasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to generate embeddings"
          
