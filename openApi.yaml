  /patients/migrate-embeddings:
    post:
      tags: [Patients]
      summary: Migrasi embedding pasien (RAG)
      description: >
        Melakukan migrasi/regenerasi embeddings untuk semua pasien 
        yang belum memiliki knowledge_base atau perlu update.
