                value:
                  patient_name: "Budi Santoso"
                  background_story: "Mahasiswa yang mengalami anxiety disorder"
                  personality_type: "introvert"
                  symptom_intensity: 7
                  age: 22
                  gender: "Laki-laki"
                  occupation: "Mahasiswa"
                  marital_status: "Belum Menikah"
                  personality_traits:
