                  maximum: 10
                  nullable: true
                  description: Intensitas gejala 1-10 (opsional)
                  example: 7
                age:
                  type: integer
                  nullable: true
                  description: Usia pasien (harus positif)
                  example: 22
                gender:
                  type: string
                  nullable: true
                  description: Jenis kelamin
                  example: "Laki-laki"
                occupation:
                  type: string
                  nullable: true
                  description: Pekerjaan/profesi
                  example: "Mahasiswa"
                marital_status:
                  type: string
                  nullable: true
                  description: Status pernikahan
                  example: "Belum Menikah"
                personality_traits:
                  type: object
                  nullable: true
                  description: Traits kepribadian dalam bentuk key-value
                  example: { "anxiety_level": "high", "social_comfort": "low" }
                is_global:
                  type: boolean
                  nullable: true
                  description: Apakah pasien bisa diakses semua user
                  example: false
                  default: false
            examples:
