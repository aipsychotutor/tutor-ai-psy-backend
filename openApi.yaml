                      patient_id:
                        type: integer
                        example: 5
                      start_time:
                        type: string
                        format: date-time
                        example: "2024-12-27T10:00:00.000Z"
                      end_time:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2024-12-27T11:30:00.000Z"
                      status:
                        type: string
                        example: "ongoing"
              examples:
                ongoing_session:
                  summary: Session yang masih berjalan
                  value:
                    success: true
                    data:
                      session_id: 1
                      user_id: 1
                      patient_id: 5
                      start_time: "2024-12-27T10:00:00.000Z"
                      end_time: null
                      status: "ongoing"
                completed_session:
                  summary: Session yang sudah selesai
                  value:
                    success: true
                    data:
                      session_id: 2
                      user_id: 1
                      patient_id: 5
                      start_time: "2024-12-26T14:00:00.000Z"
                      end_time: "2024-12-26T15:30:00.000Z"
                      status: "completed"
        "404":
          description: Session tidak ditemukan atau tidak punya akses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
              examples:
                not_found:
                  summary: Session tidak ditemukan
                  value:
                    success: false
                    message: "Session tidak ditemukan"
                no_access:
                  summary: Tidak punya akses
                  value:
                    success: false
                    message: "User tidak punya akses ke session ini"
        "500":
          description: Error server
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string

    patch:
      tags: [Sessions]
      summary: Update session
      description: >
        Mengupdate data session seperti status atau end_time.
        User hanya bisa update session miliknya sendiri.
        Status valid: ongoing, completed, cancelled.
      parameters:
        - name: id
          in: path
          required: true
          description: ID session yang akan diupdate
          schema:
            type: integer
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ongoing, completed, cancelled]
                  description: Status session baru
                  example: "completed"
                end_time:
                  type: string
                  format: date-time
                  description: Waktu akhir session (ISO 8601)
                  example: "2024-12-27T11:30:00.000Z"
            examples:
              complete_session:
                summary: Menyelesaikan session
                value:
                  status: "completed"
                  end_time: "2024-12-27T11:30:00.000Z"
              cancel_session:
                summary: Membatalkan session
                value:
                  status: "cancelled"
                  end_time: "2024-12-27T10:45:00.000Z"
              change_status_only:
                summary: Update status saja
                value:
                  status: "completed"
      responses:
        "200":
          description: Session berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Session berhasil diupdate"
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                        example: 1
                      user_id:
                        type: integer
                        example: 1
                      patient_id:
                        type: integer
                        example: 5
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                        nullable: true
                      status:
                        type: string
              examples:
                success:
                  summary: Update berhasil
                  value:
                    success: true
                    message: "Session berhasil diupdate"
                    data:
                      session_id: 1
                      user_id: 1
                      patient_id: 5
                      start_time: "2024-12-27T10:00:00.000Z"
                      end_time: "2024-12-27T11:30:00.000Z"
                      status: "completed"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
              examples:
                invalid_status:
                  summary: Status tidak valid
                  value:
                    success: false
                    message: "Status harus salah satu dari: ongoing, completed, cancelled"
        "404":
          description: Session tidak ditemukan atau tidak punya akses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
              examples:
                not_found:
                  summary: Session tidak ditemukan
                  value:
                    success: false
                    message: "Session tidak ditemukan"
                no_access:
                  summary: Tidak punya akses
                  value:
                    success: false
                    message: "User tidak punya akses ke session ini"
        "500":
          description: Error server
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string

