openapi: 3.0.3
info:
  title: Commulab System API
  description: >
    API untuk autentikasi, manajemen pasien, sesi konseling,
    chat AI, transkrip, evaluasi, dan laporan statistik.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Auth
    description: Autentikasi pengguna
  - name: Chat
    description: Chat AI dan persona
  - name: Patients
    description: Manajemen data pasien dan embedding
  - name: Sessions
    description: Manajemen sesi konseling
  - name: Reports
    description: Transkrip, evaluasi, dan statistik

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"

    AuthSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: JWT token berlaku 3 jam
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          format: email
          example: "john@gmail.com"
        role:
          type: string
          enum: [user, admin]
          example: "user"
        is_admin:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: "2024-12-27T10:00:00.000Z"

    Patient:
      type: object
      properties:
        patient_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        patient_name:
          type: string
          example: "Budi Santoso"
        background_story:
          type: string
          example: "Mahasiswa yang mengalami anxiety disorder"
        personality_type:
          type: string
          nullable: true
          example: "introvert"
        symptom_intensity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          example: 7
        age:
          type: integer
          nullable: true
          example: 22
        gender:
          type: string
          nullable: true
          example: "Laki-laki"
        occupation:
          type: string
          nullable: true
          example: "Mahasiswa"
        marital_status:
          type: string
          nullable: true
          example: "Belum Menikah"
        personality_traits:
          type: object
          nullable: true
          example: { "anxiety_level": "high", "social_comfort": "low" }
        avatar_path:
          type: string
          example: "/models/default.glb"
        profile_image:
          type: string
          nullable: true
          example: "/uploads/patient_1.jpg"
        is_active:
          type: boolean
          example: true
        is_global:
          type: boolean
          example: false
        knowledge_base:
          type: array
          nullable: true
          items:
            type: object
            properties:
              text:
                type: string
              vector:
                type: array
                items:
                  type: number
        created_at:
          type: string
          format: date-time
          example: "2024-12-27T10:00:00.000Z"

    Session:
      type: object
      properties:
        session_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        patient_id:
          type: integer
          example: 5
        start_time:
          type: string
          format: date-time
          example: "2024-12-27T10:00:00.000Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-27T11:30:00.000Z"
        status:
          type: string
          enum: [ongoing, completed, cancelled]
          example: "ongoing"

    SessionWithPatient:
      type: object
      properties:
        session_id:
          type: integer
          example: 1
        patient_id:
          type: integer
          example: 5
        patient_name:
          type: string
          example: "Budi Santoso"
        patient_image:
          type: string
          nullable: true
          example: "/uploads/patient_5.jpg"
        start_time:
          type: string
          format: date-time
          example: "2024-12-27T10:00:00.000Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-27T11:30:00.000Z"
        status:
          type: string
          enum: [ongoing, completed, cancelled]
          example: "ongoing"

    Evaluation:
      type: object
      properties:
        session_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        empathy_score:
          type: integer
          minimum: 0
          maximum: 100
          example: 85
        question_score:
          type: integer
          minimum: 0
          maximum: 100
          example: 78
        feedback_text:
          type: string
          nullable: true
          example: "Konselor menunjukkan empati yang baik"
        evaluated:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2024-12-27T11:00:00.000Z"

    Transcript:
      type: object
      properties:
        transcript_id:
          type: integer
          example: 1
        session_id:
          type: integer
          example: 1
        sender:
          type: string
          enum: [user, ai]
          example: "user"
        message:
          type: string
          example: "Saya merasa cemas belakangan ini"
        prosody_data:
          type: object
          nullable: true
          properties:
            pitch:
              type: number
              example: 220.5
            energy:
              type: number
              example: 0.75
            tempo:
              type: number
              example: 1.2
        timestamp:
          type: string
          format: date-time
          example: "2024-12-27T10:15:30.000Z"

    Persona:
      type: object
      properties:
        persona_id:
          type: integer
          example: 1
        patient_id:
          type: integer
          example: 5
        name:
          type: string
          example: "Budi Santoso"
        background_story:
          type: string
          example: "Mahasiswa semester 6 yang mengalami anxiety"
        personality_type:
          type: string
          example: "introvert"
        symptom_intensity:
          type: integer
          example: 7
        personality_traits:
          type: object
          example: { "anxiety_level": "high", "openness": "medium" }

    ChatMessage:
      type: object
      properties:
        text:
          type: string
          description: Text response dari AI
          example: "Saya mengerti perasaanmu. Ceritakan lebih lanjut?"
        facialExpression:
          type: string
          description: Ekspresi wajah avatar
          enum: [smile, sad, angry, surprised, default]
          example: "smile"
        animation:
          type: string
          description: Nama animasi avatar
          example: "Talking_1"
        audio:
          type: string
          nullable: true
          description: Base64 audio atau URL audio dari ElevenLabs
          example: "data:audio/mpeg;base64,..."

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Registrasi user baru
      description: >
        Membuat akun user baru dengan username, email, dan password.
        Password harus minimal 8 karakter dan mengandung huruf besar, 
        huruf kecil, dan angka. Setelah registrasi berhasil, user 
        otomatis mendapat JWT token yang berlaku 3 jam.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  example: johndoe
                  description: Username unik untuk user
                email:
                  type: string
                  format: email
                  example: john@gmail.com
                  description: Email unik untuk user
                password:
                  type: string
                  minLength: 8
                  example: Password123
                  description: >
                    Minimal 8 karakter, harus mengandung:
                    - Minimal 1 huruf besar (A-Z)
                    - Minimal 1 huruf kecil (a-z)
                    - Minimal 1 angka (0-9)
            examples:
              valid:
                summary: Request valid
                value:
                  username: johndoe
                  email: john@gmail.com
                  password: Password123
      responses:
        "200":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              examples:
                success:
                  summary: Registrasi berhasil
                  value:
                    status: ok
                    user:
                      user_id: 1
                      username: johndoe
                      email: john@gmail.com
                      role: user
                      is_admin: false
                      created_at: "2024-12-27T10:00:00.000Z"
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Registrasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_fields:
                  summary: Field tidak lengkap
                  value:
                    status: error
                    message: Username, email, dan password harus diisi
                weak_password:
                  summary: Password tidak memenuhi syarat
                  value:
                    status: error
                    message: Password minimal 8 karakter, mengandung huruf besar, huruf kecil, dan angka
                email_exists:
                  summary: Email sudah terdaftar
                  value:
                    status: error
                    message: Email sudah terdaftar. Silakan login.

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login user
      description: >
        Login menggunakan email dan password. Jika berhasil, 
        akan mendapat JWT token yang berlaku 3 jam. Token ini 
        digunakan untuk autentikasi endpoint lain dengan format 
        header: Authorization: Bearer <token>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: john@gmail.com
                password:
                  type: string
                  example: Password123
            examples:
              valid:
                summary: Login valid
                value:
                  email: john@gmail.com
                  password: Password123
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              examples:
                success_user:
                  summary: Login sebagai user biasa
                  value:
                    status: ok
                    user:
                      user_id: 1
                      username: johndoe
                      email: john@gmail.com
                      role: user
                      is_admin: false
                      created_at: "2024-12-27T10:00:00.000Z"
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                success_admin:
                  summary: Login sebagai admin
                  value:
                    status: ok
                    user:
                      user_id: 2
                      username: admin
                      email: admin@gmail.com
                      role: admin
                      is_admin: true
                      created_at: "2024-12-27T09:00:00.000Z"
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Login gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_fields:
                  summary: Field tidak lengkap
                  value:
                    status: error
                    message: Email dan password harus diisi
                invalid_credentials:
                  summary: Email atau password salah
                  value:
                    status: error
                    message: Email atau password salah.

  /auth/update-password:
    put:
      tags: [Auth]
      summary: Update password user
      description: >
        Mengubah password user yang sedang login. User harus memasukkan
        password lama untuk verifikasi, kemudian memasukkan password baru.
        Password baru harus memenuhi kriteria: minimal 8 karakter, 
        mengandung huruf besar, huruf kecil, dan angka.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  description: Password lama untuk verifikasi
                  example: "OldPassword123"
                newPassword:
                  type: string
                  minLength: 8
                  description: >
                    Password baru, minimal 8 karakter dengan:
                    - Minimal 1 huruf besar (A-Z)
                    - Minimal 1 huruf kecil (a-z)
                    - Minimal 1 angka (0-9)
                  example: "NewPassword456"
            examples:
              valid:
                summary: Request valid
                value:
                  oldPassword: "OldPassword123"
                  newPassword: "NewPassword456"
      responses:
        "200":
          description: Password berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "Password berhasil diperbarui"
              examples:
                success:
                  summary: Update berhasil
                  value:
                    status: "ok"
                    message: "Password berhasil diperbarui"
        "400":
          description: Update gagal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
              examples:
                missing_fields:
                  summary: Field tidak lengkap
                  value:
                    status: "error"
                    message: "Password lama dan baru harus diisi"
                wrong_old_password:
                  summary: Password lama salah
                  value:
                    status: "error"
                    message: "Password lama salah"
                weak_new_password:
                  summary: Password baru tidak memenuhi syarat
                  value:
                    status: "error"
                    message: "Password baru minimal 8 karakter, ada huruf besar, kecil, dan angka"
                user_not_found:
                  summary: User tidak ditemukan
                  value:
                    status: "error"
                    message: "User tidak ditemukan"

  /auth/delete-account:
    delete:
      tags: [Auth]
      summary: Hapus akun user
      description: >
        Menghapus akun user yang sedang login beserta seluruh data 
        yang terkait (pasien, sesi, transkrip, evaluasi, dll).
        Operasi ini bersifat permanen dan tidak dapat dibatalkan.
        User harus sudah terautentikasi untuk menggunakan endpoint ini.
      responses:
        "200":
          description: Akun berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "Akun dan seluruh data riwayat Anda telah dihapus secara permanen."
              examples:
                success:
                  summary: Penghapusan berhasil
                  value:
                    status: "ok"
                    message: "Akun dan seluruh data riwayat Anda telah dihapus secara permanen."
        "500":
          description: Error server saat menghapus akun
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "Gagal menghapus akun"
              examples:
                server_error:
                  summary: Error server
                  value:
                    status: "error"
                    message: "Gagal menghapus akun"

  /chat:
    post:
      tags: [Chat]
      summary: Kirim pesan chat ke AI
      description: >
        Mengirim pesan user ke AI dan mendapat response dalam bentuk 
        array messages yang berisi text, facial expression, animation, 
        dan audio. Jika message kosong, AI akan memberikan greeting default.
        Prosody data opsional untuk analisis intonasi suara user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Pesan dari user
                  example: "Saya merasa sedih hari ini"
                session_id:
                  type: integer
                  description: ID session konseling yang aktif
                  example: 1
                prosody_data:
                  type: object
                  description: Data prosody/intonasi suara (opsional)
                  properties:
                    pitch:
                      type: number
                      example: 220.5
                    energy:
                      type: number
                      example: 0.75
                    tempo:
                      type: number
                      example: 1.2
            examples:
              with_message:
                summary: Chat dengan pesan
                value:
                  message: "Saya merasa cemas belakangan ini"
                  session_id: 1
                  prosody_data:
                    pitch: 250.3
                    energy: 0.65
                    tempo: 1.1
              empty_message:
                summary: Greeting (message kosong)
                value:
                  message: ""
                  session_id: 1
      responses:
        "200":
          description: Respon chat berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          description: Text response dari AI
                          example: "Saya mengerti perasaanmu. Ceritakan lebih lanjut?"
                        facialExpression:
                          type: string
                          description: Ekspresi wajah avatar
                          enum: [smile, sad, angry, surprised, default]
                          example: "smile"
                        animation:
                          type: string
                          description: Nama animasi avatar
                          example: "Talking_1"
                        audio:
                          type: string
                          nullable: true
                          description: Base64 audio atau URL audio dari ElevenLabs
                          example: "data:audio/mpeg;base64,..."
              examples:
                ai_response:
                  summary: Response normal dari AI
                  value:
                    success: true
                    messages:
                      - text: "Saya mendengarkan. Ceritakan lebih lanjut tentang perasaanmu."
                        facialExpression: "smile"
                        animation: "Talking_1"
                        audio: "data:audio/mpeg;base64,..."
                default_greeting:
                  summary: Greeting default (message kosong)
                  value:
                    messages:
                      - text: "Hai... bagaimana kabarmu hari ini?"
                        facialExpression: "smile"
                        animation: "Talking_1"
                        audio: null
        "500":
          description: Error server atau API key belum diset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "API key belum diset."
              examples:
                api_key_error:
                  summary: API key tidak tersedia
                  value:
                    message: "API key belum diset."
                processing_error:
                  summary: Error saat processing
                  value:
                    success: false
                    message: "Error processing chat message"

  /chat/persona/{session_id}:
    get:
      tags: [Chat]
      summary: Ambil persona aktif berdasarkan session
      description: >
        Mengambil data persona AI yang sedang aktif untuk session tertentu.
        Persona berisi karakteristik AI seperti personality, background, 
        dan traits yang digunakan dalam percakapan.
      parameters:
        - name: session_id
          in: path
          required: true
          description: ID session konseling
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Persona berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  persona:
                    type: object
                    description: Data persona AI aktif
                    properties:
                      persona_id:
                        type: integer
                        example: 1
                      patient_id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: "Budi Santoso"
                      background_story:
                        type: string
                        example: "Seorang mahasiswa yang mengalami kecemasan..."
                      personality_type:
                        type: string
                        example: "introvert"
                      symptom_intensity:
                        type: integer
                        example: 7
                      personality_traits:
                        type: object
                        example: { "anxiety_level": "high", "openness": "medium" }
              examples:
                success:
                  summary: Persona ditemukan
                  value:
                    success: true
                    persona:
                      persona_id: 1
                      patient_id: 5
                      name: "Budi Santoso"
                      background_story: "Mahasiswa semester 6 yang mengalami anxiety"
                      personality_type: "introvert"
                      symptom_intensity: 7
                      personality_traits:
                        anxiety_level: "high"
                        social_comfort: "low"
        "500":
          description: Error saat mengambil persona
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Persona tidak ditemukan untuk session ini"

  /chat/set-persona-from-patient:
    post:
      tags: [Chat]
      summary: Set persona AI dari data patient
      description: >
        Mengatur persona AI berdasarkan data pasien yang ada. 
        Persona akan digunakan AI untuk berperilaku sesuai 
        karakteristik pasien dalam simulasi konseling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id]
              properties:
                patient_id:
                  type: integer
                  description: ID pasien yang akan dijadikan persona
                  example: 5
            examples:
              valid:
                summary: Set persona dengan patient_id
                value:
                  patient_id: 5
      responses:
        "200":
          description: Persona berhasil diset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Persona berhasil diset dari data patient"
                  activePersona:
                    type: object
                    description: Data persona yang baru diset
                    properties:
                      persona_id:
                        type: integer
                      patient_id:
                        type: integer
                      name:
                        type: string
                      background_story:
                        type: string
                  patient_id:
                    type: integer
                    description: ID pasien yang digunakan
                    example: 5
              examples:
                success:
                  summary: Persona berhasil diset
                  value:
                    success: true
                    message: "Persona berhasil diset dari data patient"
                    activePersona:
                      persona_id: 1
                      patient_id: 5
                      name: "Budi Santoso"
                      background_story: "Mahasiswa yang mengalami anxiety"
                      personality_type: "introvert"
                      symptom_intensity: 7
                    patient_id: 5
        "400":
          description: patient_id tidak diberikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "patient_id is required"
        "500":
          description: Error saat set persona
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Patient tidak ditemukan"

  /patients:
    get:
      tags: [Patients]
      summary: Ambil semua pasien
      description: >
        Mengambil daftar pasien berdasarkan user yang login. 
        User biasa hanya bisa melihat pasien miliknya sendiri dan pasien global.
        Admin bisa melihat semua pasien.
      responses:
        "200":
          description: Daftar pasien berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    patient_id:
                      type: integer
                      example: 1
                    patient_name:
                      type: string
                      example: "Budi Santoso"
                    personality_traits:
                      type: object
                      nullable: true
                      example: { "anxiety_level": "high", "openness": "medium" }
                    avatar_path:
                      type: string
                      example: "/models/default.glb"
                    created_at:
                      type: string
                      format: date-time
                      example: "2024-12-27T10:00:00.000Z"
                    is_active:
                      type: boolean
                      example: true
                    is_global:
                      type: boolean
                      example: false
                    user_id:
                      type: integer
                      example: 1
              examples:
                success:
                  summary: Daftar pasien
                  value:
                    - patient_id: 1
                      patient_name: "Budi Santoso"
                      personality_traits: { "anxiety_level": "high" }
                      avatar_path: "/models/default.glb"
                      created_at: "2024-12-27T10:00:00.000Z"
                      is_active: true
                      is_global: false
                      user_id: 1
