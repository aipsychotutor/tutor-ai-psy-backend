        generate embeddings (RAG) dari data pasien untuk meningkatkan 
        akurasi response AI. Jika embedding gagal, pasien tetap dibuat 
        tanpa RAG data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_name, background_story]
              properties:
                patient_name:
                  type: string
                  description: Nama lengkap pasien
                  example: "Budi Santoso"
                background_story:
                  type: string
                  description: Latar belakang dan riwayat pasien
                  example: "Mahasiswa semester 6 yang mengalami anxiety sejak pandemi..."
                personality_type:
                  type: string
                  nullable: true
                  description: Tipe kepribadian (opsional)
                  example: "introvert"
